embedding:
  provider: sentence_transformers
  output_directory: data/embeddings
  batch_size: 32

  model:
    name: all-MiniLM-L6-v2
    normalize_embeddings: true

  inference:
    batch_size: 32
    device: auto

vector_store:
  provider: chroma
  persist_directory: vector_db/chroma
  collection_name: bhagavatham